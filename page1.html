<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juice Shop 🍹</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    background: linear-gradient(135deg, #0f3d2e, #14532d, #064e3b);
    color:white;
    min-height:100vh;
}

/* Header */
h1{
    text-align:center;
    padding:20px;
    font-size:2.2rem;
}

/* GRID */
.container{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:12px;
    padding:12px;
}

@media(min-width:768px){
    .container{
        grid-template-columns: repeat(3, 1fr);
    }
}

@media(min-width:1024px){
    .container{
        grid-template-columns: repeat(4, 1fr);
    }
}

/* Card */
.card{
    border-radius:18px;
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.1);
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    overflow:hidden;
    transition:0.3s;
}

.card:hover{
    transform: scale(1.05);
}

/* Image */
.card img{
    width:100%;
    height:140px;
    object-fit:cover;
}

/* Content */
.card-content{
    padding:10px;
    text-align:center;
}

.card-content h3{
    font-size:16px;
}

/* Price */
.price{
    color:#22c55e;
    font-weight:bold;
    margin-top:5px;
}

</style>
</head>
<body>
<div class="container" id="productContainer"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

/* 🔥 Your Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyAVWLIDjsmMcH2kfqiKwQ1-jFU6d6654pY",
  authDomain: "myproject-fdb4c.firebaseapp.com",
  databaseURL: "https://myproject-fdb4c-default-rtdb.firebaseio.com",
  projectId: "myproject-fdb4c",
  storageBucket: "myproject-fdb4c.firebasestorage.app",
  messagingSenderId: "600134367178",
  appId: "1:600134367178:web:ea8b0daa3928c7791c8133"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const container = document.getElementById("productContainer");

/* 🔥 Fetch Data from Firebase */
onValue(ref(db, 'user'), (snapshot) => {
    container.innerHTML = "";

    snapshot.forEach((child) => {
        const data = child.val();

       container.innerHTML += `
        <div class="card">
            <a href="final.html?name=${encodeURIComponent(data.b)}&price=${data.c}&img=${encodeURIComponent(data.a)}">
                <img src="${data.a}" alt="juice"/>
            </a>
            <div class="card-content">
                <h3>${data.b}</h3>
                <div class="price">₹ ${data.c}</div>
            </div>
        </div>
        `;
    });
});

/* 🟢 WhatsApp Order Function */
window.orderNow = function(name, price){
    const phone = "91XXXXXXXXXX"; // 👉 put your number
    const message = `Hello, I want to order ${name} for ₹${price}`;
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
    window.open(url, "_blank");
}

</script>

</body>
</html>
