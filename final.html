<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Page</title>

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background: linear-gradient(-45deg, #1f4037, #2c7744, #52b788, #95d5b2);
    background-size:200% 200%;
    animation: gradientBG 18s ease infinite;

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* animation optimized */
@keyframes gradientBG{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* 🔥 MAIN CARD */
.card{
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(18px);
    padding:30px;
    border-radius:22px;
    box-shadow:0 25px 60px rgba(0,0,0,0.35);
    color:#fff;
    transition:0.4s;

    width:100%;
    max-width:420px;
}

/* Big screen layout */
@media (min-width: 900px){
    .card{
        max-width:900px;
        display:flex;
        gap:30px;
        text-align:left;
        align-items:center;
    }

    .card img{
        width:50%;
        height:300px;
    }

    .card .form{
        width:50%;
    }
}

.card:hover{
    transform: translateY(-6px);
}

/* IMAGE */
img{
    width:100%;
    height:240px;
    object-fit:cover;
    border-radius:16px;
    transition:0.4s;
}

img:hover{
    transform: scale(1.05);
}

/* TEXT */
h1{
    text-align: center;
    font-size:22px;
    margin-bottom:5px;
    opacity:0.9;
}

h2{
    text-align: center;
    margin:10px 0 5px;
    font-size:24px;
}

.price{
    text-align: center;
    font-size:26px;
    font-weight:bold;
    margin:10px 0;
    color:#00ffae;
}

/* QUANTITY */
.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin:18px 0;
}

.controls button{
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.2);
    color:white;
    font-size:20px;
    cursor:pointer;
    transition:0.3s;
}

.controls button:hover{
    background:#00ffae;
    color:#000;
}

#qty{
    font-size:20px;
    font-weight:bold;
}

/* INPUTS */
input{
    width:100%;
    margin:10px 0;
    padding:12px;
    border-radius:12px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.2);
    color:white;
    font-size:14px;
}

input::placeholder{
    color:#ddd;
}

/* BUTTON */
.order-btn{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:14px;
    background:linear-gradient(45deg,#00b894,#00cec9);
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.order-btn:hover{
    transform: scale(1.05);
    box-shadow:0 12px 25px rgba(0,0,0,0.3);
}

/* MESSAGE */
#messages{
    font-size:14px;
    color:#ff7675;
    margin-top:5px;
}

/* 📱 MOBILE IMPROVEMENTS */
@media (max-width: 480px){
    .card{
        padding:20px;
        border-radius:18px;
    }

    img{
        height:200px;
    }

    h2{
        font-size:20px;
    }

    .price{
        font-size:35px;
        color: #000;
    }
      input{
        width: 90%;      
        max-width: 320px;     
        text-align: center; 
    }
}
</style>
</head>

<body>

<div class="card">
    <img id="img">
    <div class="price" id="price"></div>
    <h2 id="productName"></h2>

    <div class="controls">
        <button id="decrease">−</button>
        <div class="qty" id="qty">1</div>
        <button id="increase">+</button>
    </div>

    <div class="form">
        <input type="text" placeholder="Enter your name" id="customerName"/>
        <input type="number" placeholder="Enter phone number" id="phone"/>
        <div id="messages" style="font-size: medium;color:red;text-align:center"></div>
        <button class="order-btn" onclick="orderNow()">Order Now</button>
        <div id="success" style="display:flex;justify-content:center;color:rgb(128, 0, 87);"></div>
    </div>
</div>

<script type="module">
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
        
        const firebaseConfig = {
        apiKey: "AIzaSyAVWLIDjsmMcH2kfqiKwQ1-jFU6d6654pY",
        authDomain: "myproject-fdb4c.firebaseapp.com",
        databaseURL: "https://myproject-fdb4c-default-rtdb.firebaseio.com",
        projectId: "myproject-fdb4c",
        storageBucket: "myproject-fdb4c.firebasestorage.app",
        messagingSenderId: "600134367178",
        appId: "1:600134367178:web:ea8b0daa3928c7791c8133",
        measurementId: "G-CQFS0NF7CL"
        };
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

    const params = new URLSearchParams(window.location.search);

    let quantity = 1;
    const name = params.get("name");
    const price = Number(params.get("price"));
    const img = params.get("img");

    document.getElementById("img").src = img;
    document.getElementById("productName").innerText = name;

    function updatePrice(){
        document.getElementById("price").innerText = "₹ " + (price * quantity);
        document.getElementById("qty").innerText = quantity;
    }

    document.getElementById("increase").addEventListener("click",function(){
        quantity++;
        updatePrice();
    });

    document.getElementById("decrease").addEventListener("click",function(){
        if(quantity > 1){
            quantity--;
            updatePrice();
        }
    });

window.orderNow = function () {
    const customer = document.getElementById("customerName").value;
    const phone = document.getElementById("phone").value;

    if (customer === "" || phone === "") {
        document.getElementById("messages").innerHTML = `Please enter correct!`;
        return;
    }
    document.getElementById("orderBtn").disabled = true;
    document.getElementById("success").innerHTML = "Your order is booking...";

    const options = {
    enableHighAccuracy: true,
    timeout: 30000,
    maximumAge: 0
};

let bestAccuracy = Infinity;
let bestPosition = null;
let orderPlaced = false; // 🔒 prevent duplicate insert

document.getElementById("success").innerHTML = "Getting your location...";

const watchId = navigator.geolocation.watchPosition(

    function (position) {
        const accuracy = position.coords.accuracy;

        console.log("Accuracy:", accuracy);

        // Save best result
        if (accuracy < bestAccuracy) {
            bestAccuracy = accuracy;
            bestPosition = position;
        }

        // Wait until good accuracy
        if (accuracy < 30 && !orderPlaced) {
            orderPlaced = true; // 🔒 lock

            navigator.geolocation.clearWatch(watchId);

            let lat = bestPosition.coords.latitude;
            let lng = bestPosition.coords.longitude;

            console.log("Final LatLng:", lat, lng);

            const refdata = push(ref(database, "submit"));
            const dict = { a: customer, b: phone, c1: lat, c2: lng };

            set(refdata, dict).then(() => {

                document.getElementById("success").innerHTML = "";

                const message = `New Order
                Name: ${customer}
                Phone: ${phone}
                Product: ${name}
                Quantity: ${quantity}
                Total: ₹ ${price * quantity}`;

                const whatsappNumber = "919576718589";

                window.location.href =
                    "https://wa.me/" + whatsappNumber +
                    "?text=" + encodeURIComponent(message);
            })
            .catch(() => {
                alert("Failed to save order. Try again!");
                orderPlaced = false; // unlock if failed
            });
        }
    },

    function (error) {
        alert("Location error: " + error.message);
        document.getElementById("orderBtn").disabled = false;
    },

    options
);
};
updatePrice();
</script>
</body>
</html>
