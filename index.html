<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Store</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body.dark {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #e6e6e6;

    transition: background 0.4s ease, color 0.3s ease;
.toggle-btn{
     background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
}
}
/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 20px 8%;
    align-items: center;
}

.logo {
    font-size: 22px;
    font-weight: 600;
    color: #4CAF50;
}

.nav-links a {
    margin: 0 15px;
    text-decoration: none;
    color: #333;
    font-weight: 500;
}

.toggle-btn {
    display:block;
   justify-content: center;
   align-items: center;
   margin: 0 auto;
    background: #ffffff;
    border: none;
    padding: 15px 65px;
    border-radius: 20px;
    color: white;
    cursor: pointer;
}

.hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2rem; /* better spacing between elements */
    padding: clamp(40px, 6vw, 80px) 8%;
    max-width: 1200px;
    margin: 0 auto; /* center the section */
    flex-wrap: wrap;
}

/* Optional: better control for child elements */
.hero > * {
    flex: 1 1 300px; /* responsive columns */
}

/* LEFT */
.hero-text {
    max-width: 500px;
}

.hero-text h1 {
    font-size: 50px;
    margin-bottom: 20px;
}

.hero-text p {
    color: #666;
    margin-bottom: 25px;
    line-height: 1.6;
}
.footer{
    display: flex;
    justify-content: center;
    align-items: center;
}
/* BUTTON */
.btn {
    padding: 15px 35px;
    border-radius: 40px;
    border: none;
    background: linear-gradient(135deg, #6dbf5b, #3f7f3f);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 15px 30px rgba(0,0,0,0.2);
}

/* IMAGE */
.hero-img {
    position: relative;
}

.hero-img img {
    width: 380px;
    border-radius: 50%;
    animation: float 4s ease-in-out infinite;
}

/* FLOAT ANIMATION */
@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
}

/* SECTION */


/* MOBILE */
@media(max-width:768px){
    .hero {
        flex-direction: column;
        text-align: center;
    }

    .hero-text h1 {
        font-size: 34px;
    }

    .hero-img img {
        width: 260px;
        margin-top: 20px;
    }

    .navbar {
        flex-direction: column;
        gap: 10px;
    }
}
</style>
</head>

<body>

    <button class="toggle-btn" onclick="Dark()">🌙</button>
</div>

<!-- HERO -->
<div class="hero">
    <div class="hero-text">
        <h1>Buy Fresh Fruit Juice. Live Better 🍊</h1>
        <p>
            Premium organic fruit juices are delivered straight to your door, bringing you the freshness and purity you deserve while making healthy living simple, convenient, and effortlessly enjoyable every day.
        </p>
        <button class="btn" onclick="goToShop()">Shop Now</button>
    </div>

    <div class="hero-img">
        <img src="https://images.unsplash.com/photo-1619566636858-adf3ef46400b">
    </div>
</div>

<!-- PRODUCTS -->
<!-- FOOTER -->
<div class="footer">
    © 2026 FreshMart • All rights reserved
</div>
<script>
function goToShop(){
    window.location.href="page1.html";
}
function Dark(){
    document.body.classList.toggle('dark');
}
</script>
</body>
</html>
